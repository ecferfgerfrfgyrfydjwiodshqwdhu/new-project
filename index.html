<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सोशल मीडिया रिपोर्ट जनरेटर</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background-color: #f0fdf4;
        }
        /* Toast Notification Styling */
        #toast {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl md:text-4xl font-bold text-green-700 flex justify-center items-center gap-2">
            <svg class="w-8 h-8 md:w-10 md:h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            सोशल मीडिया रिपोर्ट जनरेटर
        </h1>
        <p class="text-gray-600 mt-2 text-sm md:text-base">टीमों की व्हाट्सएप रिपोर्ट को एक साथ पेस्ट करें और एक क्लिक में फाइनल रिपोर्ट पाएं।</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Input Section -->
        <div class="bg-white rounded-xl shadow-lg border border-green-100 p-5 flex flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <label for="inputData" class="font-semibold text-lg text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    यहाँ टीमों की रिपोर्ट पेस्ट करें:
                </label>
                <button id="clearBtn" class="text-sm text-red-500 hover:text-red-700 font-medium px-2 py-1 rounded transition-colors">
                    साफ करें (Clear)
                </button>
            </div>
            
            <textarea id="inputData" class="flex-grow w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none resize-none h-80 lg:h-96" placeholder="सत साहेब जी, सभी टीमों की रिपोर्ट यहाँ पेस्ट करें"></textarea>
            
            <button id="generateBtn" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-all transform hover:scale-[1.01] flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                फाइनल रिपोर्ट बनाएँ
            </button>
        </div>

        <!-- Output Section -->
        <div class="bg-white rounded-xl shadow-lg border border-green-100 p-5 flex flex-col h-full">
            <div class="flex justify-between items-center mb-4">
                <label for="outputData" class="font-semibold text-lg text-gray-700 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    आपकी फाइनल रिपोर्ट:
                </label>
                <button id="copyBtn" class="bg-blue-100 text-blue-700 hover:bg-blue-200 hover:text-blue-800 font-semibold py-1.5 px-4 rounded-lg transition-colors flex items-center gap-1 text-sm shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    कॉपी करें
                </button>
            </div>

            <!-- Optional Override Settings -->
            <div class="flex gap-3 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <div class="w-1/2">
                    <label class="block text-xs text-gray-500 mb-1">तहसील (बदल सकते हैं)</label>
                    <input type="text" id="tehsilInput" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-green-400 outline-none" placeholder="उदा. बाड़मेर">
                </div>
                <div class="w-1/2">
                    <label class="block text-xs text-gray-500 mb-1">दिनांक (बदल सकते हैं)</label>
                    <input type="text" id="dateInput" autocomplete="off" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-green-400 outline-none" placeholder="DD/MM/YYYY">
                </div>
            </div>

            <textarea id="outputData" class="flex-grow w-full border border-gray-300 rounded-lg p-4 text-base font-medium font-mono bg-blue-50 focus:outline-none resize-none h-64 lg:h-auto text-gray-800" readonly placeholder="यहाँ आपकी तैयार रिपोर्ट दिखाई देगी..."></textarea>
        </div>
        
    </main>

    <!-- Custom Toast Notification (Instead of alert) -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl hidden opacity-0 z-50 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage">रिपोर्ट कॉपी हो गई!</span>
    </div>

    <!-- Application Logic -->
    <script>
        // Set Default Date on Load
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const dateStr = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
            document.getElementById('dateInput').value = dateStr;
        });

        // Generate Logic
        document.getElementById('generateBtn').addEventListener('click', () => {
            const btn = document.getElementById('generateBtn');
            const originalBtnHtml = btn.innerHTML;
            
            const text = document.getElementById('inputData').value;
            
            if (!text.trim()) {
                showToast('कृपया पहले रिपोर्ट का टेक्स्ट पेस्ट करें!', 'error');
                return;
            }

            // --- विज़ुअल फ़ीडबैक (लोडिंग इफ़ेक्ट) ---
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> अपडेट हो रहा है...`;
            document.getElementById('outputData').value = "नई रिपोर्ट बन रही है...";
            
            // थोड़ी सी देरी (Delay) ताकि यूज़र को लगे कि रिफ्रेश हो रहा है
            setTimeout(() => {
                let presentCount = 0;
                let totalCount = 0;
                let attendanceLinesFound = 0;
                
                let totalLikes = 0;
                let totalComments = 0;
                let totalSubs = 0;

                const lines = text.split('\n');
                
                for (let line of lines) {
                    const lowerLine = line.toLowerCase();
                    
                    // --- 1. Calculate Attendance (अब टेक्स्ट 05/07 से पढ़ेगा) ---
                    if (lowerLine.includes('उपस्थिति') || lowerLine.includes('कुल सेवादार') || lowerLine.includes('कुल भगत')) {
                        attendanceLinesFound++;
                        
                        // X/Y फॉर्मेट ढूंढें (जैसे 05/07 या 7/5)
                        const fractionMatch = lowerLine.match(/(\d+)\s*\/\s*(\d+)/);
                        if (fractionMatch) {
                            let num1 = parseInt(fractionMatch[1], 10);
                            let num2 = parseInt(fractionMatch[2], 10);
                            presentCount += Math.min(num1, num2); // छोटा नंबर उपस्थित
                            totalCount += Math.max(num1, num2);   // बड़ा नंबर कुल भगत
                        } else {
                            // अगर सिर्फ एक नंबर हो (जैसे उपस्थिति:- 5)
                            const nums = lowerLine.match(/\d+/g);
                            if (nums && nums.length > 0) {
                                presentCount += parseInt(nums[0], 10);
                                totalCount += parseInt(nums[0], 10); 
                            }
                        }
                    }

                    // --- 2. Calculate Likes, Comments, Subscribes ---
                    // नंबर ढूंढें, चाहे उनके बीच स्पेस या * हो (जैसे 00*4 या 00 5)
                    const matchObj = lowerLine.match(/\d[*\s\d]*\d|\d/); 
                    
                    if (matchObj) {
                        const cleanNumString = matchObj[0].replace(/[^\d]/g, '');
                        const num = parseInt(cleanNumString, 10);

                        if (!isNaN(num)) {
                            if (lowerLine.includes('लाइक') || lowerLine.includes('like') || lowerLine.includes('लाईक')) {
                                totalLikes += num;
                            } else if (lowerLine.includes('कमेंट') || lowerLine.includes('comment')) {
                                totalComments += num;
                            } else if (lowerLine.includes('सबस्क्राइब') || lowerLine.includes('सब्सक्राइब') || lowerLine.includes('subscribe') || lowerLine.includes('सब्सक्राइब सेवा')) {
                                totalSubs += num;
                            }
                        }
                    }
                }

                let absentCount = totalCount > presentCount ? totalCount - presentCount : 0;

                // Fallback: अगर किसी वजह से 'उपस्थिति' नहीं लिखा है, तब हम निशानों (Emojis) को गिनेंगे
                if (attendanceLinesFound === 0) {
                    const presentMatches = text.match(/[✔️✅☑️✔✓]/g);
                    presentCount = presentMatches ? presentMatches.length : 0;

                    const absentMatches = text.match(/[❌✖️❎✖✕]/g);
                    absentCount = absentMatches ? absentMatches.length : 0;

                    totalCount = presentCount + absentCount;
                }

            // --- 3. Extract Tehsil Name dynamically ---
            let tehsil = "";
            const tehsilMatch = text.match(/तहसील\s*[-.]*\s*([a-zA-Z\u0900-\u097F]+)/i);
            if (tehsilMatch && tehsilMatch[1]) {
                tehsil = tehsilMatch[1].trim();
            } else {
                const altMatch = text.match(/([a-zA-Z\u0900-\u097F]+)\s*\.{3,}\s*तहसील/i);
                if (altMatch && altMatch[1]) {
                    tehsil = altMatch[1].trim();
                }
            }
            // Fallback if regex fails but user input is there
            const userTehsil = document.getElementById('tehsilInput').value || tehsil || "बाड़मेर";
            
            // Set the extracted Tehsil back to the input box so user can see/edit
            document.getElementById('tehsilInput').value = userTehsil;

            // Date Input
            let dateStr = document.getElementById('dateInput').value;

            // --- 4. Format Output ---
            const output = `*तहसील .. ${userTehsil}.......*
*सोशल मीडिया सेवादारों की उपस्थिति*
*दिनांक -${dateStr}*
*उपस्थित भगत - ${presentCount}/${totalCount}*
*अनुपस्थित-${absentCount}*
*यूट्यूब वीडियो सेवा*
*लाइक -*${totalLikes}
*कमेंट -*${totalComments}
*सब्सक्राइब -*${totalSubs}`;

            document.getElementById('outputData').value = output;
            
            // बटन को वापस पहले जैसा करें और मैसेज दिखाएं
            btn.innerHTML = originalBtnHtml;
            showToast('रिपोर्ट अपडेट हो गई है!', 'success');
            
            // Animate output briefly
            const outArea = document.getElementById('outputData');
            outArea.classList.add('bg-green-100');
            setTimeout(() => outArea.classList.remove('bg-green-100'), 600);
            
            }, 400); // 400ms delay
        });

        // Copy Logic
        document.getElementById('copyBtn').addEventListener('click', () => {
            const outText = document.getElementById('outputData');
            if (!outText.value) {
                showToast('कॉपी करने के लिए पहले रिपोर्ट जनरेट करें!', 'error');
                return;
            }
            outText.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges(); // Deselect text
            showToast('रिपोर्ट कॉपी हो गई है! अब आप इसे व्हाट्सएप ग्रुप में भेज सकते हैं।', 'success');
        });

        // Clear Logic
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('inputData').value = '';
            document.getElementById('outputData').value = '';
            
            // तारीख को आज की तारीख पर रिफ्रेश करें
            const today = new Date();
            const dateStr = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;
            document.getElementById('dateInput').value = dateStr;
        });

        // Custom Toast Notification Function
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            
            toastMsg.textContent = message;
            
            // Change color based on error or success
            if (type === 'error') {
                toast.classList.replace('bg-gray-800', 'bg-red-600');
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-800');
            }

            toast.classList.remove('hidden');
            // Slight delay to allow display:block to apply before opacity transition
            setTimeout(() => {
                toast.classList.remove('opacity-0');
            }, 10);

            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300); // Wait for transition to finish
            }, 3000);
        }
    </script>
</body>
</html>
